<!DOCTYPE html>
<html>
<head>
  <style>
    /* Background color using :root */
    :root {
      background-color: rgb(135, 206, 235);
    }

    article {
      padding: 12px;
      width: 80%;
      margin: auto;
    }

    /* Paragraph styles */
    article p:first-child {
      background-color: black;
      color: white;
      padding: 8px;
    }

    article p:nth-child(2) {
      color: black; /* standard text */
    }

    article p:last-child {
      color: red;
    }

    /* List styles */
    ul {
      list-style-type: disc;
      padding: 0;
      margin-top: 16px;
    }

    ul li {
      width: 50%;
      padding: 10px;
      background-color: gray;
    }

    ul li:nth-child(odd) {
      background-color: white;
    }

    ul li:first-child,
    ul li:last-child {
      font-size: 22px;
    }

    /* Third-to-last item (i.e., item 3 in a 5-item list) */
    ul li:nth-last-child(3) {
      background-color: pink;
    }
  </style>
</head>
<body>
  <article>
    <p>First paragraph… Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
    <p>Second paragraph… Nullam dictum felis eu pede mollis pretium.</p>
    <p>Third paragraph… Nam eget dui. Etiam rhoncus.</p>

    <ul>
      <li>First Item</li>
      <li>Second Item</li>
      <li>Third Item</li>
      <li>Fourth Item</li>
      <li>Fifth Item</li>
    </ul>
  </article>
</body>
</html>
